name: Functional Tests

on:
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

jobs:
  functional:
    name: ${{ matrix.name }}
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-functional-tests')

    runs-on: ubuntu-24.04

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Fedora 44 (x86_64)"
            distro: x86_64-f44
            test_extra_args: "--ovs-track"
            cargo_cmd_opts: ""
          - name: "Fedora Rawhide (x86_64)"
            distro: x86_64-rawhide
            test_extra_args: "--ovs-track"
            cargo_cmd_opts: ""
          - name: "CentOS 8 Stream (x86_64)"
            distro: x86_64-c8s
            test_extra_args: "--ignore=test_ovs.py --ignore=test_nft.py"
            cargo_cmd_opts: "--no-default-features"
          - name: "CentOS 9 Stream (x86_64)"
            distro: x86_64-c9s
            test_extra_args: "--ovs-track"
            cargo_cmd_opts: ""
          - name: "CentOS 10 Stream (x86_64)"
            distro: x86_64-c10s
            test_extra_args: "--ovs-track"
            cargo_cmd_opts: ""
          - name: "Ubuntu Jammy (x86_64)"
            distro: x86_64-jammy
            test_extra_args: ""
            cargo_cmd_opts: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Change KVM perms
        run: |
          # Grant rw access to /dev/kvm via udev rule.
          # GitHub-hosted runners are not in the kvm group by default.
          # See https://github.com/orgs/community/discussions/8305
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Compute weekly cache key
        run: |
          # Invalidate once a week: key is the date of last Monday.
          echo "WEEK_KEY=$(date -d 'last monday' +%Y%m%d)" >> $GITHUB_ENV

      - name: Cache Vagrant boxes
        uses: actions/cache@v4
        with:
          path: |
            ~/.vagrant.d/boxes
            ~/.cache/retis-vagrant
          key: vagrant-boxes-${{ matrix.distro }}-${{ env.WEEK_KEY }}-${{ hashFiles('Vagrantfile') }}
          restore-keys: |
            vagrant-boxes-${{ matrix.distro }}-${{ env.WEEK_KEY }}
            vagrant-boxes-${{ matrix.distro }}

      - name: Install Vagrant
        run: |
          # Install Vagrant from Hashicorp directly.
          # The version shipped with Ubuntu fails to download some boxes.
          # See https://bugs.launchpad.net/vagrant/+bug/2017828.
          wget -O- https://apt.releases.hashicorp.com/gpg | \
            gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
            https://apt.releases.hashicorp.com $(lsb_release -cs) main" | \
            sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y update
          sudo DEBIAN_FRONTEND=noninteractive apt-get -y install \
            vagrant ruby-libvirt qemu-kvm virt-manager libvirt-daemon-system \
            virtinst libvirt-clients bridge-utils pkg-config libxslt-dev \
            libxml2-dev libvirt-dev zlib1g-dev ruby-dev gcc make ruby-nokogiri

          vagrant plugin install vagrant-libvirt

          sudo systemctl enable --now libvirtd

          # Grant the runner user access to the libvirt socket directly,
          # avoiding the need for group membership and re-login.
          sudo chmod a+rw /var/run/libvirt/libvirt-sock

      - name: Prepare Ubuntu libvirt box
        if: matrix.distro == 'x86_64-jammy'
        env:
          VAGRANTFILE_HASH: ${{ hashFiles('Vagrantfile') }}
        run: |
          set -euxo pipefail

          marker="$HOME/.cache/retis-vagrant/ubuntu-jammy-build"
          expected="$WEEK_KEY $VAGRANTFILE_HASH"

          if [ -f "$marker" ] &&
             [ "$(cat "$marker")" = "$expected" ] &&
             vagrant box list | grep -q '^ubuntu-jammy-libvirt '; then
            echo "Using cached Ubuntu box"
            exit 0
          fi

          sudo DEBIAN_FRONTEND=noninteractive apt-get -y install \
            libguestfs-tools qemu-utils jq

          workdir=$(mktemp -d)
          trap 'rm -rf "$workdir"' EXIT
          cd "$workdir"

          base_url=https://cloud-images.ubuntu.com/jammy/current
          curl -fsSLO "$base_url/jammy-server-cloudimg-amd64.img"
          curl -fsSLO "$base_url/SHA256SUMS"
          sha256sum --ignore-missing --check SHA256SUMS

          mv jammy-server-cloudimg-amd64.img box.img
          vagrant_pubkey=$(find /opt/vagrant/embedded -name vagrant.pub -type f -print -quit)

          cat > network.yaml <<'EOF'
          network:
            version: 2
            renderer: networkd
            ethernets:
              all:
                match:
                  name: "en*"
                dhcp4: true
                dhcp6: false
          EOF

          sudo virt-customize --no-network -a box.img \
            --run-command 'id -u vagrant >/dev/null 2>&1 || useradd --create-home --shell /bin/bash vagrant' \
            --run-command 'usermod --append --groups sudo vagrant' \
            --run-command 'printf "vagrant ALL=(ALL) NOPASSWD: ALL\\n" > /etc/sudoers.d/vagrant' \
            --run-command 'ssh-keygen -A' \
            --run-command 'systemctl enable ssh' \
            --mkdir /home/vagrant/.ssh \
            --upload "$vagrant_pubkey:/home/vagrant/.ssh/authorized_keys" \
            --upload network.yaml:/etc/netplan/99-vagrant.yaml \
            --run-command 'chown -R vagrant:vagrant /home/vagrant/.ssh' \
            --run-command 'chmod 700 /home/vagrant/.ssh && chmod 600 /home/vagrant/.ssh/authorized_keys'

          virtual_size=$(qemu-img info --output=json box.img | \
            jq -r '."virtual-size" / 1073741824 | ceil')
          cat > metadata.json <<EOF
          {"provider":"libvirt","format":"qcow2","virtual_size":$virtual_size}
          EOF
          cat > Vagrantfile <<'EOF'
          Vagrant.configure("2") do |config|
            config.ssh.username = "vagrant"
            config.ssh.insert_key = false
            config.vm.provider "libvirt" do |libvirt|
              libvirt.machine_virtual_size = 20
            end
          end
          EOF

          tar czf ubuntu-jammy-libvirt.box box.img metadata.json Vagrantfile
          vagrant box remove ubuntu-jammy-libvirt --all || true
          vagrant box add ubuntu-jammy-libvirt ubuntu-jammy-libvirt.box

          mkdir -p "$(dirname "$marker")"
          echo "$expected" > "$marker"

      - name: Boot VM
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          if [ "${DISTRO}" != x86_64-jammy ]; then
            vagrant box update -f ${DISTRO}
          fi
          vagrant box prune -f
          # Retry once to overcome transient network glitches.
          vagrant up ${DISTRO} --no-tty --provision || vagrant up ${DISTRO} --no-tty --provision
          vagrant halt --no-tty ${DISTRO} || vagrant halt --no-tty --force ${DISTRO}
          # Restart the VM after the update without reprovisioning.
          vagrant up --no-tty --no-provision ${DISTRO}
          mkdir -p -m 0700 ~/.ssh
          vagrant ssh-config ${DISTRO} >> ~/.ssh/config

      - name: Guest info
        env:
          DISTRO: ${{ matrix.distro }}
        run: |
          echo "--- Host info ---"
          ssh ${DISTRO} 'sh -exc "uname -a"'

      - name: Run functional tests
        env:
          DISTRO: ${{ matrix.distro }}
          TEST_EXTRA_ARGS: ${{ matrix.test_extra_args }}
          CARGO_CMD_OPTS: ${{ matrix.cargo_cmd_opts }}
        run: |
          ssh -tt ${DISTRO} "env CARGO_CMD_OPTS=$CARGO_CMD_OPTS bash --login -exc 'cd /vagrant && make V=1'"
          ssh -tt ${DISTRO} "cd /vagrant/tests && sudo python3 -m pytest ${TEST_EXTRA_ARGS}"
          ssh -tt ${DISTRO} "bash --login -exc 'cd /vagrant && sudo make functional-tests'"

      - name: Teardown VM
        if: always()
        env:
          DISTRO: ${{ matrix.distro }}
        run: vagrant destroy -f ${DISTRO} || true
